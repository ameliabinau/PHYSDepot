        <h1><span style="color: rgb(136, 190, 0);">〘</span> Quantum Information <span style="color: rgb(136, 190, 0);">〙</span></h1>

        <img src="https://physdepot.org/graphics/Quantum_Banner.jpeg" width = 100%/>

        <h2>Resources & Tools</h2>

        <div class="card-container">
            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">IBM Quantum Platform</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): None. Usage Requirements: Web-based; only
                        internet connection and free sign-in (IBMid) required.</p>
                    <p>The IBM Quantum Platform offers some of the best resources for beginner and more advanced quantum computing I've ever seen. Accessable upon creation of an IBMid, this web-based resource allows users to send quantum programs straight to IBM's quantum processors. They also offer a variety of learning resources, including the Quantum Composer, a beautiful, clean interactive where individuals can toy around with quantum circuitry and immediately generate the corresponding code in Qiskit or OpenQASM 2.0. The platform offers courses in the fundementals of quantum computing <a href="https://learning.quantum.ibm.com/">(IBM Quantum Learning)</a>. If you're an individual interested in experimenting with quantum computing/programming, the IBM Quantum Platform is a must-have. The only drawback is the user is only allotted 10 minutes of runtime on IBM's GPU's per month, which depending on the complexity of your quantum algorithums, may be a lot or too little.</p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://quantum.ibm.com/" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Quantum Algorithm Zoo</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): Packages for best implementation of each quantum algorithm listed, most Python-based. Usage Requirements: Internet connection, Python IDE or other quantum computation tools needed for execution of algorithms</p>
                    <p>It's in the name! Created by Stephen P. Jordan at Google Quantum AI, this site hosts a remarkable catalog of quantum algorithm descriptions and packages for quality implementation. Use it to compare algorithm design and runtime, and explore further using the associated <a href="https://quantumgraph.info/">Quantum Map</a>, a visual network of relationships between algorithms. </p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://quantumalgorithmzoo.org/" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Open Quantum Safe & liboqs</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): C. Usage Requirements: Internet connection, C compiler, GitHub for liboqs</p>
                    <p>Designed to promote the free use of quantum computer-resistant cryptography algorithms and prepare open cryptography techniques for the post-quantum computing age. Open Quantum Safe hosts liboqs, a library of C-based quantum cryptography algorithms on their <a href="https://github.com/open-quantum-safe/liboqs">GitHub</a>.</p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://openquantumsafe.org/" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Microsoft Quantum Katas</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): Written in Q# and C# (also accessible via Python/Jupyter Notebooks). Usage Requirements: Requires internet connection when using website.</p>
                    <p>
                        An open-source collection of self-paced interactive tutorials and programming exercises.
                        Katas is designed to teach quantum computing concepts and the Q# programming language hands-on.
                        Each "kata" covers specific topics, like qubits, quantum states, measurements, and quantum algorithms.
                        The collection has automated unit tests that instantly validate the learner's code. 
                        It is an excellent tool for beginners wanting to learn quantum programming and Microsoft's Q# language.
                        The link provided goes directly to the Katas learning site, <i>not the GitHub.</i>
                    </p>
                    <p class="resource-contributor">Contributor: Neil Ghugare, University of Florida</p>
                    <a class="collapsible-content-button" href="https://quantum.microsoft.com/en-us/tools/quantum-katas" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

<!-- INSERT_QUANTUM_SOFTWARE -->

        <h2>Packages</h2>

        <div class="card-container">
            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">IBM Qiskit</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): Python. Usage Requirements: Python-compatible IDE</p>
                    <p>Qiskit is the most popular go-to package for quantum computing and simulating/executing quantum algorithms. Providing a suite of add-ons and tools, Qiskit allows for the construction, simulation, and execution of quantum circuitry on IBM quantum or classical computers. Plenty of documentation and example code is available online and functions for specific problem-solving application and optimization. </p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://www.ibm.com/quantum/qiskit" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">PennyLane</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): Python. Usage Requirements: Python-compatible IDE, optional hardware or alternate back-end simulations</p>
                    <p>Integrate machine learning, simulation, quantum circuitry, and hardware using PennyLane's multifaceted array of capabilities designed to interface between quantum techniques. It is built to support research in QC, ML, and quantum chemistry. The platform provides ample documentation for all its functionalities, including <a href="https://pennylane.ai/qml">tutorials</a> for getting started with quantum computing and ML.</p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://pennylane.ai/" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Microsoft Quantum Development Kit (QDK) & Q#</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): Primary development in Q#, host scripts can be written in Python, C#, or F#. Also has support for Qiskit and OpenQASM. Usage Requirements: Integrates as an extension for VS Code or Jupyter Notebooks. Runs locally on standard desktop hardware, and connects online via Azure Quantum to execute jobs.</p>
                    <p>
                        An open-source, domain-specific framework designed by Microsoft for building and executing quantum algorithms. 
                        The power from this framework stems from its high-level qubit resource management, and its local simulation and visualization abilities. 
                        Microsoft has been recently focusing on QDK for scientific applications, like (quantum) chemistry, so you can see the real-world usage of QDK first-hand. 
                        The link provided goes to Microsoft's QDK documentation, <i>not the GitHub.</i>
                    </p>
                    <p class="resource-contributor">Contributor: Neil Ghugare, University of Florida</p>
                    <a class="collapsible-content-button" href="https://learn.microsoft.com/en-us/azure/quantum/" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">QuTiP</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): Requires Python and Python packages (Numpy, Scipy, Cython, and Matplotlib). Works on any desktop/laptop OS.</p>
                    <p>
                        QuTiP is an open-source software which simulates the dynamics of open quantum systems. 
                        It allows for numerical simulations of many Hamiltonians, even those with arbitrary time-dependence. 
                        These Hamiltonians have a large range of practical physics applications including quantum optics, trapped ions, quantum nanomechanical resonators, and superconducting surfaces.
                        It being completely free makes it idea for exploring quantum mechanics/dynamics and having no licensing fees makes it a good pick for classrooms too.
                    </p>
                    <p class="resource-contributor">Contributor: Neil Ghugare, University of Florida</p>
                    <a class="collapsible-content-button" href="https://qutip.org/" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Cirq</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): Built using Python, requires Python 3.</p>
                    <p>
                        Cirq is yet another open-source framework for programming qunatum computers.
                        Cirq is a Python library which allows for the writing, manipulation, optimization, and execution of quantum circuits and code on quantum computers and quantum simulators.
                        One advantage of Cirq is its abstractions for dealing with modern noisy intermediate-scale quantum (NISQ) computers.
                    </p>
                    <p class="resource-contributor">Contributor: Neil Ghugare, University of Florida</p>
                    <a class="collapsible-content-button" href="https://quantumai.google/cirq" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">QuEST</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): C/C++. Usage Requirements: Requires a C/C++ compiler like Clang, GCC, etc., depending on the user's usage. Depending on what the user wants, you may need an MPI compiler and/or a GPU compiler.</p>
                    <p>
                        QuEST stands for the <strong>Qu</strong>antum <strong>E</strong>xact <strong>S</strong>imulation <strong>T</strong>oolkit.
                        It is a high-performance simulator of quantum circuits, state-vectors, and density matrices too.
                        QuEST also uses multithreading, GPU acceleration, and distribution to run ridiculously fast on laptops, desktops, and supercomputers.
                        The developers pride themselves that "QuEST <i>just works</i>", meaning it is stand-alon, requires no installation, and is incredibly easy to compile and get running.
                    </p>
                    <p class="resource-contributor">Contributor: Neil Ghugare, University of Florida</p>
                    <a class="collapsible-content-button" href="https://quest.qtechtheory.org/" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">QHAT Quantum Hamiltonian Analysis Toolkit</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">
                        Language Requirement(s): Requires Python with Python dependencies.
                        Usage Requirements: Runs on local consumer hardware or cluster nodes. Built on open-source quantum computational libraries and works offline.
                    </p>
                    <p>
                        An open-source Python framework designed to streamline the study of Hamiltonians for fault-tolerant quantum computing.
                        The framework involves Hamiltonian generators from molecule descriptions, analysis of quantum algorithms involving Hamiltonians, and even Julia scripts for Trotter error calculation of time evolution/ground state energy.
                        Also important is the attached <a href="https://arxiv.org/pdf/2605.11162" target="_blank" rel="noopener">academic paper</a>.
                    </p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington, <i>Curator</i>; Neil Ghugare, University of Florida, <i>Writer</i></p>
                    <a class="collapsible-content-button" href="https://github.com/lanl/qhat" target="_blank" rel="noopener">Click here to access this resource</a>
                </div>
            </button>

        <h2>Datasets</h2>
        <div class="card-container">
            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">QDataSet</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): Python, Jupyter. Usage Requirements: Python, Jupyter-compatible IDE</p>
                    <p>Set of 52 open data sets for the use of training and evaluating quantum computing and QC machine learning models, complete with example notebooks. More information in the associated <a href="https://arxiv.org/pdf/2108.06661" target="_blank" rel="noopener">manuscript</a>.</p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://github.com/eperrier/QDataSet" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>
