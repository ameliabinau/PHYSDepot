        <h2>Resources & Tools</h2>

        

        <div class="card-container">
            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Slooh</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Fairly strong internet connection, paid
                        subscription.</p>
                    <p>Slooh is a powerful online platform that allows educators and amateur astronomers remotely access
                        telescopes in Chile, the Canary Islands, and Australia. Simply select a target & telescope,
                        queue a scheduling block, adjust preferences, and watch as your research-grade image is
                        captured. It is a brilliant, interactive way to explore the cosmos. Slooh hosts a variety of
                        educational events and more advanced research options (have your data exported as FITS files for
                        more detailed examination) and a constant stream of observations is available to watch in
                        real-time. While the service comes with a price, I helped use this platform for <a href="https:
                            //www.physics.purdue.edu/outreach/">Purdue University's physics and astronomy outreach
                            program</a> and I can personally attest it is worth the investment if you're strongly
                            interested in amateur astronomy but are overwhelmed with the mechanics/cost of a full
                            personal telescope.</p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University</p>
                    <a class="collapsible-content-button" href="https://www.slooh.com/amateurs" target="_blank">Click
                        here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">W3Schools: Coding & Web Development</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Internet Connection</p>
                    <p>W3Schools is a useful website to learn a huge variety of programming languages, ranging from
                        Java, C, C++, html, css, SQL, Python and some of its commonly used libraries, and more.</p>
                    <p class="resource-contributor">Contributor: Akshith Karri, Purdue University</p>
                    <a class="collapsible-content-button" href="https://www.w3schools.com/" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Zooniverse Citizen Science</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Internet Connection</p>
                    <p>A classic, well-known platform hosting maintained projects in a variety of fields (often astrophysics and ecology) that require community participation to classify, organize, and analyze data. Each project features a game-like user interface that walks each participant through the scientific details of the project and how the user contributes/analyzes data. For example, in the ongoing <a href="https://www.zooniverse.org/projects/orionnau/rubin-comet-catchers">Rubin Comet Catchers</a> project, citizen scientists can review Vera Rubin Observatory images of small solar system objects to search for signs of comet activity! Zooniverse is a fun way to introduce the mechanisms of scientific research to new audiences and participate hands-on with publishable science!</p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://www.zooniverse.org/" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">DoITPoMS Material Science IT</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Internet Connection</p>
                    <p>Created by researchers at Cambridge, DoITPoMS hosts a library of materials in fundemental-advanced material sciences. Browse learning/teaching resources, simulations, and a collection of micrographs.</p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://www.doitpoms.ac.uk/index.php" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Falstad Circuit Simulator</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Internet Connection</p>
                    <p>A simple, online interface for simulating simple circuits. Loads with a sample LCR circuit and displays plots of the voltage and current applied to each component as a function of time. Provides a sizable <a href="https://www.falstad.com/circuit/e-index.html">index of sample circuits</a> to browse and learn from.</p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://www.falstad.com/circuit/" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Falstad Simulation Applets</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Internet Connection</p>
                    <p>Explore a glorious, complete collection of physics simulations for use in the classroom, self-studying, or even in the laboratory. Interactive simulations for topics ranging from electrodynamics, Fourier series, waveguides, acoustics, simple quantum models, wave dynamics, orbital dynamics, optics, semiconductors, molecular dynamics, and more.</p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://www.falstad.com/mathphysics.html" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Ohmie Electronics App</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Apple App Store Installation</p>
                    <p>A gamified Apple-based app that trains the user in electronic troubleshooting and circuit building, similar to common language-learning apps. Students and learners can practice their quick recall and decision-making skills involving circuitry! Topics include electronics, digital circuits, semiconductors, embedded systems, programming, PCB design, and robotics.</p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://ohmie.io/#how" target="_blank">Click here
                        to access this resource</a>
                </div>
            </button>

             <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">ZequnWeb Projectile Motion Calculator</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Requirements: A web browser and an internet connection to open the webpage. No account, software installation, or file upload is required.</p>
                    <p>A free educational calculator for ideal projectile motion. Enter initial speed (m/s), launch angle (degrees), initial height (m), and gravitational acceleration (m/s²) to calculate flight time, horizontal range, maximum height, and a table of sample positions. Independent learners can compare numerical outputs with hand calculations while studying the effects of launch conditions. The model assumes constant gravity and excludes air resistance and wind; it is not a predictor of real-world trajectories. Submitted by the publisher, ZequnWeb.</p>
                    <p class="resource-contributor">Contributor: Anonymous</p>
                    <a class="collapsible-content-button" href="https://zequnweb.com/tools/projectile-motion-calculator/" target="_blank">Click here to access this resource</a>
                </div>
            </button>
                         <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Mini Golf STEM Activity: Classroom Lesson Plan</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Requirements: A browser/internet connection to read the free public guide. The activity uses common materials such as cardboard, tape, cups or paper towel tubes, lightweight balls, safe putting tools and a ruler or meter stick. No specific operating system, code, paid equipment or external dataset is required.</p>
                    <p>A free 45–90 minute lesson for introducing force, friction, slopes, angles and measurement through a homemade mini golf hole. Learners build a lane, test putts under comparable conditions, record strokes or target distances, revise one feature and compare results. The guide includes common-material construction steps, fair-testing guidance, safety suggestions, age adaptations, and middle-school extensions using averages and graphs. It mainly suits grades 3–8 and can be adapted by families, camps, homeschoolers or teachers. It may be useful as an introductory physical-science activity for independent learners; it is not a research simulation or advanced physics dataset. I am the creator of Mini Golf Spots and am nominating my own existing public resource. No account or purchase is needed.</p>
                    <p class="resource-contributor">Contributor: Anders Myrmel — independent creator of Mini Golf Spots</p>
                    <a class="collapsible-content-button" href="https://minigolfspots.com/blog/mini-golf-stem-activity" target="_blank">Click here to access this resource</a>
                </div>
            </button>
                         <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Online Spectrum Analyzer</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Requirements: Modern web browser; microphone permission for live audio input; internet connection to load the website.</p>
                    <p>Online Spectrum Analyzer is a browser-based educational tool for exploring sound frequencies and digital audio signals. Students can inspect FFT spectra, spectrograms, frequency peaks, and harmonic structures using microphone input or recorded audio. It also provides adjustable FFT sizes, allowing learners to observe the tradeoff between frequency resolution and time resolution. The core functionality is free and requires no account or programming knowledge. It is suitable for introductory acoustics, sound waves, and digital signal processing demonstrations. The measurements are digital signal levels rather than calibrated sound pressure measurements.</p>
                    <p class="resource-contributor">Contributor: Terry Beer</p>
                    <a class="collapsible-content-button" href="https://onlinespectrumanalyzer.com" target="_blank">Click here to access this resource</a>
                </div>
            </button>
                         <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Space Atlas</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Internet connection and current desktop/mobile browser with JavaScript. No account or dedicated hardware.</p>
                    <p>Space Atlas is a free English-language interactive astronomy and introductory physics learning resource for independent learners and teacher-led activities. Learners can manipulate a Moon-phase model (https://saramjh.github.io/space_atlas_student/moon/phases/), study axial tilt and the seasons (https://saramjh.github.io/space_atlas_student/earth/seasons/) and explore cosmic scales (https://saramjh.github.io/space_atlas_student/universe/scale/). Suggested activity: predict a phase/season, adjust the model, explain what changed and relate it to the physical geometry. It is a conceptual education tool, not research-grade orbital simulation or an accredited course. I am its creator and offer it for independent curation.</p>
                    <p class="resource-contributor">Contributor: Jihun Oh — Independent software developer; Daejeon, South Korea</p>
                    <a class="collapsible-content-button" href="https://saramjh.github.io/space_atlas_student/" target="_blank">Click here to access this resource</a>
                </div>
            </button>
