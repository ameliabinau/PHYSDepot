                <h2 class="collapsible-card-title">ImageJ: Java-Powered Image Processing Software</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): None. Usage Requirements: Java-Based
                        Operating System</p>
                    <p>Java-based image processing program with Java plugins and recordable macros useful for image
                        processing and analysis problems in biophysics. ImageJ can be run in browser!</p>
                    <p class="resource-contributor">Contributor: Jin Oueslati, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://imagej.net/ij/" target="_blank">Click here to
                        access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">ArcGIS Pro</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Only runs on Windows; requires a subscription but most universities have access.</p>
                    <p>World’s leading mapping and GIS processing software; essential for almost any GIS project. Analyze complex structures, conduct geospacial analysis & data management.</p>
                    <p class="resource-contributor">Contributor: Allison Loper, Purdue University - West Lafayette</p>
                    <a class="collapsible-content-button" href="https://www.esri.com/en-us/arcgis/products/arcgis-pro/overview" target="_blank">Click here to
                        access this resource</a>
                </div>
            </button>

        <h2>Packages</h2>

        <div class="card-container">

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">AMBER: Biomolecular Simulation Program Suite</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): C++, C, Fortran, or Python for pytraj. Usage Requirements: AMBER suite, compilers for appropriate languages, Linux or Unix terminal & Bash, Python-Compatable IDE for pytraj.</p>
                    <p>Amber allows for the simulation of biological macromolecules' dynamics through the use of an array of pre-programmed "force fields" from which the user can select. The program developers have created a detailed series of introductory courses for the suite found <a href="https://ambermd.org/tutorials/index.php">here</a> and yearly <href="https://ambermd.org/Manuals.php">reference manuals</href> are published. The program central to AMBER is <a href="https://ambermd.org/tutorials/analysis/tutorial0/index.php">CPPTRAJ</a>, which developers have created a Python wrapper for called <a href="https://ambermd.org/tutorials/analysis/tutorial_notebooks/pytraj_notebook/index.php">pytraj</a>.</p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://climetlab.readthedocs.io/en/latest/examples.html" target="_blank">Click here to
                        access this resource</a>
                </div>
            </button>

             <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Biopython</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Python-compatible interpreter/IDE, internet connection. Language Requirements: Python.</p>
                    <p>Biopython is an all-in-one Python package for all things bioinformatics and biology-related computation. Documentation is complete and engaging to read, many examples of major functionalities are detailed, including gene sequencing, working with sequences, and loading/accessing major biological data repositories. </p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://biopython.org/" target="_blank">Click here to access this resource</a>
                </div>
            </button>
