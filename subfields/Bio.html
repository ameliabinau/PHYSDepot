        <h2>Resources & Tools</h2>

        <div class="card-container">
            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">ImageJ: Java-Powered Image Processing Software</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): None. Usage Requirements: Java-Based
                        Operating System</p>
                    <p>Java-based image processing program with Java plugins and recordable macros useful for image
                        processing and analysis problems in biophysics. ImageJ can be run in browser!</p>
                    <p class="resource-contributor">Contributor: Jin Oueslati, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://imagej.net/ij/" target="_blank">Click here to
                        access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">ArcGIS Pro</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Only runs on Windows; requires a subscription but most universities have access.</p>
                    <p>World’s leading mapping and GIS processing software; essential for almost any GIS project. Analyze complex structures, conduct geospacial analysis & data management.</p>
                    <p class="resource-contributor">Contributor: Allison Loper, Purdue University - West Lafayette</p>
                    <a class="collapsible-content-button" href="https://www.esri.com/en-us/arcgis/products/arcgis-pro/overview" target="_blank">Click here to
                        access this resource</a>
                </div>
            </button>

<!-- INSERT_BIO_SOFTWARE -->


        </div>

        <h2>Packages</h2>

        <div class="card-container">

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">AMBER: Biomolecular Simulation Program Suite</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Language Requirement(s): C++, C, Fortran, or Python for pytraj. Usage Requirements: AMBER suite, compilers for appropriate languages, Linux or Unix terminal & Bash, Python-Compatable IDE for pytraj.</p>
                    <p>Amber allows for the simulation of biological macromolecules' dynamics through the use of an array of pre-programmed "force fields" from which the user can select. The program developers have created a detailed series of introductory courses for the suite found <a href="https://ambermd.org/tutorials/index.php">here</a> and yearly <href="https://ambermd.org/Manuals.php">reference manuals</href> are published. The program central to AMBER is <a href="https://ambermd.org/tutorials/analysis/tutorial0/index.php">CPPTRAJ</a>, which developers have created a Python wrapper for called <a href="https://ambermd.org/tutorials/analysis/tutorial_notebooks/pytraj_notebook/index.php">pytraj</a>.</p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://climetlab.readthedocs.io/en/latest/examples.html" target="_blank">Click here to
                        access this resource</a>
                </div>
            </button>

             <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Biopython</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">Usage Requirements: Python-compatible interpreter/IDE, internet connection. Language Requirements: Python.</p>
                    <p>Biopython is an all-in-one Python package for all things bioinformatics and biology-related computation. Documentation is complete and engaging to read, many examples of major functionalities are detailed, including gene sequencing, working with sequences, and loading/accessing major biological data repositories. </p>
                    <p class="resource-contributor">Contributor: Amelia Binau, Indiana University - Bloomington</p>
                    <a class="collapsible-content-button" href="https://biopython.org/" target="_blank">Click here to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">OpenMM</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">
                        Language Requirement(s): Writen in C++, features native Python (and other) bindings for development.
                        Usage Requirements: Cross-platform. Requires CMake to build from source, or can be installed via pip or Conda. Works offline, requires more packages for GPU support, like CUDA/OpenCL.
                    </p>
                    <p>
                        A high-performance toolkit for molecular simulations. Researchers can interface with OpenMM (typically via Python) to implement custom forces, integration algorithms, and machine-learning potentials without rewriting CUDA or C++ code.
                        OpenMM has two parts: (i) a set of libraries for those who want to design and add molecular simulations to their programs, and (ii) an application layer for users who simply want to run simulations.
                    </p>
                    <p class="resource-contributor">Contributor: Neil Ghugare, University of Florida</p>
                    <a class="collapsible-content-button" href="https://openmm.org/documentation" target="_blank" rel="noopener">Click here to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">Rosetta</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">
                        Language Requirement(s): Written in C++, includes Python bindings via <code>PyRosetta</code>.
                        Usage Requirements: Runis natively on UNIX environments. Requires a free academic license to download source code. Compiles via SCons or CMake, works offline on laptops or HPC clusters. 
                    </p>
                    <p>
                        A comprehensive software suite for macromolecular modeling, structure prediction, and de novo protein design.
                        It enables researchers to predict 3D structures from primary amino acids, model protein-protein infterfaces, and design novel enzymes. 
                    </p>
                    <p class="resource-contributor">Contributor: Neil Ghugare, University of Florida</p>
                    <a class="collapsible-content-button" href="https://rosettacommons.org/software/" target="_blank" rel="noopener">Click here to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">PyMOL</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">
                        Language Requirement(s): Written in C and Python, features Python command line.
                        Usage Requirements: Works cross-platform on standard user hardware, works offline. Available as an open-source build or incentive-supported binary.
                    </p>
                    <p>
                        A user-sponsored molecular visualization system, used to render high-resolution 3D models of proteins/DNA/RNA. 
                        The module is lightweight and fast, and is able to produce publication-quality representations and ray-traced images of biochemical molecules.
                    </p>
                    <p class="resource-contributor">Contributor: Neil Ghugare, University of Florida</p>
                    <a class="collapsible-content-button" href="https://pymol.org/" target="_blank" rel="noopener">Click here to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">MDAnalysis</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">
                        Language Requirement(s): Written in Python, utilizes C extensions/Cython for performance.
                        Usage Requirements: Standard Python environment via <code>pip</code> or <code>conda</code>. Works cross-platform on standard hardware and operates offline.
                    </p>
                    <p>
                        An open-source tool used for the analysis of molecular simulation data to study molecular structures and dynamics.
                        It enables users to efficiently analyze molecular dynamics (MD), including particle-based trajectories and individual coordinate frames.
                        With <code>numpy</code>, you can also access atomic coordinates, which help extract subsets of structures and support trajectory transformations.
                    </p>
                    <p class="resource-contributor">Contributor: Neil Ghugare, University of Florida</p>
                    <a class="collapsible-content-button" href="https://www.mdanalysis.org/" target="_blank" rel="noopener">Click here to access this resource</a>
                </div>
            </button>

        <h2>Datasets</h2>

        <h3>A large collection of curated computational biology datasets for machine learning can be found at <a href="https://github.com/AdaptInfer/CompBioDatasetsForMachineLearning" target="_blank" rel="noopener">this GitHub repository.</a></h3>
        
        <div class="card-container">

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">RCSB Protein Data Bank (PDB)</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">
                        Language Requirement(s): Typically accessed via API using Python, R, or JavaScript, or through direct downloads of standard <code>.pdb</code> files and other file formats.
                        Usage Requirements: Web-based database query platform, requires internet connection to download for later offline viewing/analysis.
                    </p>
                    <p>
                        A single-archive repository containing experimentally determined 3D structures of biological macromolecules.
                        It serves as a foundational database for structural biology and computational biophysics research. 
                    </p>
                    <p class="resource-contributor">Contributor: Neil Ghugare, University of Florida</p>
                    <a class="collapsible-content-button" href="https://www.rcsb.org/" target="_blank" rel="noopener">Click here to access this resource</a>
                </div>
            </button>

            <button class="collapsible-card collapsed">
                <h2 class="collapsible-card-title">AlphaFold Protein Structure Database (AlphaFoldDB)</h2>
                <div class="collapsible-card-info">
                    <p class="resource-requirements">
                        Language Requirement(s): Acess via APIs or standard file format downloads like <code>.pdb</code> files.
                        Usage Requirements: Web browser interface hosted by EMBL-EBI. Internet connection required to search sequences or download predictions, no local computational hardware required for data entries themselves.
                    </p>
                    <p>
                        An open-access database developed by Google DeepMind and EMBL-EBI, containing high-confidence, AI-predicted 3D protein structures for over 200 million sequence entries.
                        It covers almost the entire known protein universe, allowing researchers to study structures that have not yet been solved experimentally.
                    </p>
                    <p class="resource-contributor">Contributor: Neil Ghugare, University of Florida</p>
                    <a class="collapsible-content-button" href="https://www.alphafold.ebi.ac.uk/" target="_blank" rel="noopener">Click here to access this resource</a>
                </div>
            </button>
