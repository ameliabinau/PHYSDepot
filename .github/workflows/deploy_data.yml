name: Inject Formatted HTML Card

on:
  workflow_dispatch:
    inputs:
      item_title:
        required: true
      item_requirements:
        required: true
      item_description:
        required: true
      item_contributor:
        required: true
      item_link:
        required: true
      target_file:
        required: true
      target_anchor:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  inject-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Inject Card Engine
        env:
          TITLE: ${{ github.event.inputs.item_title }}
          REQS: ${{ github.event.inputs.item_requirements }}
          DESC: ${{ github.event.inputs.item_description }}
          CONTRIB: ${{ github.event.inputs.item_contributor }}
          LINK: ${{ github.event.inputs.item_link }}
          FILE: ${{ github.event.inputs.target_file }}
          ANCHOR: ${{ github.event.inputs.target_anchor }}
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const filePath = process.env.FILE;
          const anchor = process.env.ANCHOR;

          // 1. Build the exact card layout string 
          const card = \`             <button class=\"collapsible-card collapsed\">
                          <h2 class=\"collapsible-card-title\">\${process.env.TITLE}</h2>
                          <div class=\"collapsible-card-info\">
                              <p class=\"resource-requirements\">Usage Requirements: \${process.env.REQS}</p>
                              <p>\${process.env.DESC}</p>
                              <p class=\"resource-contributor\">Contributor: \${process.env.CONTRIB}</p>
                              <a class=\"collapsible-content-button\" href=\"\${process.env.LINK}\" target=\"_blank\">Click here to access this resource</a>
                          </div>
                      </button>\n\`;

          // 2. Validate file existence safely
          if (!fs.existsSync(filePath)) {
            console.error(\`❌ Error: The file '\${filePath}' does not exist in your repository!\`);
            process.exit(1);
          }

          let fileContent = fs.readFileSync(filePath, 'utf8');

          // 3. Check for anchor tag presence inside target file
          if (!fileContent.includes(anchor)) {
            console.error(\`❌ Error: The anchor tag comment '\${anchor}' was not found inside '\${filePath}'!\`);
            console.log('Please verify your comment spelling matches your spreadsheet options identically.');
            process.exit(1);
          }

          // 4. Inject card smoothly above anchor tag loop
          const updatedContent = fileContent.replace(anchor, \`\${card}            \${anchor}\`);
          fs.writeFileSync(filePath, updatedContent, 'utf8');
          console.log('✅ Success: Card layout injected successfully!');
          "

      - name: Create Pull Request for Review
        uses: peter-evans/create-pull-request@v6
        with:
          # FIXED LINE: Points to your high-clearance Repository Secret
          token: ${{ secrets.AUTOMATION_PAT }}
          commit-message: "Automated entry: Add card for ${{ github.event.inputs.item_title }}"
          title: "New Resource Submission: ${{ github.event.inputs.item_title }}"
          body: "Target File: ${{ github.event.inputs.target_file }} | Target Anchor: ${{ github.event.inputs.target_anchor }}"
          branch: "suggested-entry-${{ github.run_id }}-${{ github.run_number }}"
          base: "main"

