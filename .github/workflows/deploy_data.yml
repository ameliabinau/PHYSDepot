name: Inject Formatted HTML Card

on:
  workflow_dispatch:
    inputs:
      item_title:
        required: true
      item_requirements:
        required: true
      item_description:
        required: true
      item_contributor:
        required: true
      item_link:
        required: true
      target_file:
        required: true
      target_anchor:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  inject-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build and Inject HTML Block
        env:
          TITLE: ${{ github.event.inputs.item_title }}
          REQS: ${{ github.event.inputs.item_requirements }}
          DESC: ${{ github.event.inputs.item_description }}
          CONTRIB: ${{ github.event.inputs.item_contributor }}
          LINK: ${{ github.event.inputs.item_link }}
          FILE: ${{ github.event.inputs.target_file }}
          ANCHOR: ${{ github.event.inputs.target_anchor }}
        run: |
          python -c "
          import os
          
          # 1. Grab inputs safely out of the environment
          file_path = os.getenv('FILE')
          anchor = os.getenv('ANCHOR')
          
          # 2. Build the exact card block layout
          card = (
              '             <button class=\"collapsible-card collapsed\">\n'
              f'                <h2 class=\"collapsible-card-title\">{os.getenv(\"TITLE\")}</h2>\n'
              '                <div class=\"collapsible-card-info\">\n'
              f'                    <p class=\"resource-requirements\">Usage Requirements: {os.getenv(\"REQS\")}</p>\n'
              f'                    <p>{os.getenv(\"DESC\")}</p>\n'
              f'                    <p class=\"resource-contributor\">Contributor: {os.getenv(\"CONTRIB\")}</p>\n'
              f'                    <a class=\"collapsible-content-button\" href=\"{os.getenv(\"LINK\")}\" target=\"_blank\">Click here to\n'
              '                        access this resource</a>\n'
              '                </div>\n'
              '            </button>\n'
          )
          
          # 3. Read the HTML target file text
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()
              
          # 4. Find the placeholder anchor tag and slot the card above it
          if anchor in content:
              updated_content = content.replace(anchor, f'{card}            {anchor}')
              with open(file_path, 'w', encoding='utf-8') as f:
                  f.write(updated_content)
              print('Successfully injected.')
          else:
              print(f'Error: Could not find target anchor tag: {anchor}')
              exit(1)
          "

      - name: Create Pull Request for Review
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Automated entry: Add card for ${{ github.event.inputs.item_title }}"
          title: "New Resource Submission: ${{ github.event.inputs.item_title }}"
          body: "Target File: ${{ github.event.inputs.target_file }} | Target Anchor: ${{ github.event.inputs.target_anchor }}"
          branch: "suggested-entry-${{ github.run_id }}-${{ github.run_number }}"
          base: "main"
